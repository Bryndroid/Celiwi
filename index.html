<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Celiwi sirenita</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        /* === ESTILOS GENERALES Y PIXEL ART === */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Press Start 2P', monospace; user-select: none; }
        body { background-color: #2c1a3b; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; perspective: 1000px; margin: 0; }

        /* === CONTENEDORES PRINCIPALES Y SCROLL PERSONALIZADO === */
        #game-window {
            width: 100vw; height: 100vh; max-width: 1024px; max-height: 680px;
            background-color: #fdf0f5; position: relative; overflow: hidden;
            box-shadow: 0 0 20px rgba(0,0,0,0.8); border: 4px solid #4a148c; display: flex; flex-direction: column;
        }

        #scroll-area {
            width: 100%; height: 100%; overflow-y: auto; overflow-x: hidden; position: relative;
        }
        
        /* Diseño del Scrollbar Kawaii */
        #scroll-area::-webkit-scrollbar { width: 12px; }
        #scroll-area::-webkit-scrollbar-track { background: #fdf0f5; border-left: 2px solid #ce93d8; }
        #scroll-area::-webkit-scrollbar-thumb { background: #ba68c8; border-radius: 6px; border: 2px solid #4a148c; }
        #scroll-area::-webkit-scrollbar-thumb:hover { background: #ab47bc; }

        #room-container {
            width: 100%; min-height: 100%; display: flex; flex-direction: column; position: relative;
        }

        /* === BOLA DE DISCO Y LUCES DE FIESTA === */
        #disco-lights {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 85; 
            mix-blend-mode: overlay;
            animation: discoColors 2s infinite alternate;
        }
        @keyframes discoColors {
            0% { background-color: rgba(255, 0, 100, 0.4); }
            33% { background-color: rgba(0, 255, 100, 0.4); }
            66% { background-color: rgba(100, 0, 255, 0.4); }
            100% { background-color: rgba(255, 200, 0, 0.4); }
        }

        #disco-wire {
            position: absolute; top: 0; left: 50%; transform: translateX(-50%);
            width: 4px; height: 25px; background-color: #4a148c; z-index: 86;
        }

        #disco-ball {
            position: absolute; top: 25px; left: 50%; transform: translateX(-50%);
            width: 60px; height: 60px; border-radius: 50%; z-index: 87;
            background-color: #e0e0e0;
            border: 4px solid #4a148c;
            box-shadow: 0 0 15px rgba(255,255,255,0.8), inset -5px -5px 15px rgba(0,0,0,0.4);
            background-image:
                linear-gradient(rgba(0,0,0,0.15) 6px, transparent 6px),
                linear-gradient(90deg, rgba(0,0,0,0.15) 6px, transparent 6px);
            background-size: 10px 10px;
            animation: spinDisco 1s linear infinite;
        }
        @keyframes spinDisco { 0% { background-position: 0 0; } 100% { background-position: 20px 0; } }

        /* === SALÓN DE CLASES CON PATRONES === */
        #wall {
            width: 100%; height: 55%; flex-shrink: 0;
            background: repeating-linear-gradient(45deg, #f8bbd0, #f8bbd0 20px, #fce4ec 20px, #fce4ec 40px);
            border-bottom: 8px solid #ce93d8; position: relative; display: flex; justify-content: center; align-items: center; padding-top: 10px;
        }

        #floor {
            width: 100%; height: 45%; flex-shrink: 0;
            background-color: #ba68c8;
            background-image: 
                linear-gradient(45deg, #ab47bc 25%, transparent 25%, transparent 75%, #ab47bc 75%, #ab47bc), 
                linear-gradient(45deg, #ab47bc 25%, transparent 25%, transparent 75%, #ab47bc 75%, #ab47bc);
            background-size: 40px 40px; background-position: 0 0, 20px 20px;
            position: relative; perspective: 800px;
        }

        /* === PIZARRA Y TEXTO EFECTO TIZA === */
        #chalkboard {
            width: 85%; max-width: 800px; height: 70%; background-color: #4a148c; border: 12px solid #ff69b4; border-radius: 4px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5), 8px 8px 0px rgba(0,0,0,0.1);
            display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; position: relative; z-index: 2;
        }
        
        #chalkboard-text {
            color: rgba(255, 255, 255, 0.9);
            font-size: clamp(14px, 3.5vw, 40px); text-align: center; line-height: 1.5;
            text-shadow: 
                1px 1px 0px rgba(255,255,255,0.5),
                -1px -1px 0px rgba(255,255,255,0.5),
                0px 0px 3px rgba(255,255,255,0.8),
                2px 2px 5px rgba(255,255,255,0.3);
            opacity: 0; transform: scale(0);
        }

        /* === ESCRITORIO DEL PROFESOR === */
        #teacher-area {
            position: absolute; bottom: -15px; right: 5%; width: 30%; max-width: 250px; display: flex; flex-direction: column; align-items: center; z-index: 5;
        }
        .teacher-desk-top { width: 100%; height: 25px; background-color: #f48fb1; border: 4px solid #4a148c; border-radius: 4px; position: relative; z-index: 3; }
        .teacher-desk-base { width: 90%; height: 40px; background-color: #f8bbd0; border-left: 4px solid #4a148c; border-right: 4px solid #4a148c; border-bottom: 4px solid #4a148c; }
        
        .cake { position: absolute; bottom: 60px; display: flex; flex-direction: column; align-items: center; z-index: 4; }
        .cake-layer-top { width: 50px; height: 25px; background-color: #ffffff; border: 3px solid #4a148c; border-bottom: none; position: relative; }
        .cake-layer-bottom { width: 80px; height: 35px; background-color: #ffb6c1; border: 3px solid #4a148c; }
        .candles { display: flex; gap: 8px; position: absolute; top: -15px; }
        .candle { width: 6px; height: 15px; background-color: #ffd54f; border: 2px solid #4a148c; position: relative; }
        .flame { width: 6px; height: 8px; background-color: #ff7043; border-radius: 50%; position: absolute; top: -10px; left: -2px; animation: flicker 0.5s infinite alternate; }
        @keyframes flicker { 0% { transform: scale(1); opacity: 0.8; } 100% { transform: scale(1.2); opacity: 1; } }

        /* === CELINA CELEBRANDO (Centro) === */
        #celina {
            position: absolute; bottom: 0px; left: 50%; transform: translateX(-50%); z-index: 15;
            display: flex; flex-direction: column; align-items: center;
            animation: celebrate-bounce 0.8s infinite alternate ease-in-out;
        }
        @keyframes celebrate-bounce { 0% { bottom: 0px; } 100% { bottom: 15px; } }

        .c-hair-back { position: absolute; width: 56px; height: 90px; background-color: #1a1a1a; border: 3px solid #4a148c; border-radius: 25px 25px 0 0; top: -5px; z-index: 1; }
        .c-head { width: 44px; height: 40px; background-color: #ffe0bd; border: 3px solid #4a148c; border-radius: 12px; position: relative; z-index: 3; display: flex; justify-content: center; align-items: center; gap: 10px; }
        .c-bangs { position: absolute; top: -2px; width: 44px; height: 12px; background-color: #1a1a1a; border-bottom: 2px solid #4a148c; border-radius: 10px 10px 0 0; }
        .c-eye { width: 10px; height: 6px; border: 3px solid #4a148c; border-bottom: none; border-radius: 10px 10px 0 0; margin-top: 10px; }
        .c-blush { width: 8px; height: 4px; background-color: #ff8a80; position: absolute; top: 25px; border-radius: 5px; }
        .c-blush.left { left: 4px; } .c-blush.right { right: 4px; }

        .c-torso-group { display: flex; align-items: flex-start; margin-top: -2px; z-index: 2; position: relative; }
        .c-shirt { width: 30px; height: 25px; background-color: #ffffff; border: 3px solid #4a148c; border-radius: 5px 5px 0 0; margin: 0 -2px; z-index: 3; position: relative; }
        .c-arm { position: absolute; width: 10px; height: 22px; background-color: #ffe0bd; border: 3px solid #4a148c; border-radius: 5px; top: 5px; z-index: 1; }
        .c-arm-left { left: -12px; transform: rotate(135deg); transform-origin: top right; }
        .c-arm-right { right: -12px; transform: rotate(-135deg); transform-origin: top left; }
        .c-skirt { width: 36px; height: 12px; background-color: #ff69b4; border: 3px solid #4a148c; border-radius: 0 0 5px 5px; margin-top: -3px; z-index: 2; position: relative; }
        .c-legs { display: flex; gap: 6px; margin-top: -3px; z-index: 1; position: relative; }
        .c-leg { width: 10px; height: 15px; background-color: #ffe0bd; border: 3px solid #4a148c; border-radius: 0 0 4px 4px; }

        /* === GATOS === */
        #cat-gold {
            position: absolute; bottom: 5px; left: calc(50% - 65px); z-index: 15;
            width: 34px; height: 28px; background-color: #ffca28; border: 3px solid #4a148c; border-radius: 12px 12px 6px 6px; transform: scaleX(-1);
        }
        #cat-gold::before, #cat-gold::after { content: ''; position: absolute; top: -10px; width: 0; height: 0; border-left: 7px solid transparent; border-right: 7px solid transparent; border-bottom: 10px solid #4a148c; }
        #cat-gold::before { left: -3px; } #cat-gold::after { right: -3px; }
        #cat-gold .cat-eye { width: 4px; height: 4px; background-color: #4a148c; position: absolute; top: 10px; border-radius: 50%; }
        #cat-gold .cat-eye:nth-child(1) { left: 6px; } #cat-gold .cat-eye:nth-child(2) { right: 6px; }
        .cat-paw { position: absolute; bottom: -3px; width: 10px; height: 6px; background-color: #ffca28; border: 2px solid #4a148c; border-radius: 4px; }
        .paw-l { left: 4px; } .paw-r { right: 4px; }
        #cat-gold .cat-tail { position: absolute; right: -8px; bottom: 4px; width: 10px; height: 20px; background-color: transparent; border-right: 4px solid #ffca28; border-bottom: 4px solid #ffca28; border-radius: 0 0 10px 0; }

        #cat-gray {
            position: absolute; bottom: 5px; left: calc(50% + 35px); z-index: 15;
            width: 34px; height: 28px; background-color: #616161; border: 3px solid #4a148c; border-radius: 12px 12px 6px 6px;
        }
        #cat-gray::before, #cat-gray::after { content: ''; position: absolute; top: -10px; width: 0; height: 0; border-left: 7px solid transparent; border-right: 7px solid transparent; border-bottom: 10px solid #4a148c; }
        #cat-gray::before { left: -3px; } #cat-gray::after { right: -3px; }
        #cat-gray .cat-eye { width: 4px; height: 4px; background-color: #4a148c; position: absolute; top: 10px; border-radius: 50%; }
        #cat-gray .cat-eye:nth-child(1) { left: 6px; } #cat-gray .cat-eye:nth-child(2) { right: 6px; }
        #cat-gray .cat-tail { position: absolute; right: -8px; bottom: 4px; width: 10px; height: 20px; background-color: transparent; border-right: 4px solid #616161; border-bottom: 4px solid #616161; border-radius: 0 0 10px 0; }

        /* === PUPITRES === */
        .desk-group { position: absolute; display: flex; flex-direction: column; align-items: center; transition: z-index 0.3s; }
        #desk-1 { bottom: 60%; left: 10%; width: 15%; z-index: 10;}
        #desk-2 { bottom: 60%; left: 50%; transform: translateX(-50%); width: 15%; z-index: 10;}
        #desk-3 { bottom: 60%; right: 10%; width: 15%; z-index: 10;}
        #desk-4 { bottom: 35%; left: 20%; width: 20%; z-index: 20;}
        #desk-5 { bottom: 35%; left: 50%; transform: translateX(-50%); width: 20%; z-index: 20;}
        #desk-6 { bottom: 35%; right: 20%; width: 20%; z-index: 20;}
        #desk-7 { bottom: 5%; left: 10%; width: 25%; z-index: 30;}
        #desk-8 { bottom: 5%; left: 50%; transform: translateX(-50%); width: 25%; z-index: 5;}
        #desk-9 { bottom: 5%; right: 10%; width: 25%; z-index: 30;}

        .desk-top { width: 100%; height: clamp(20px, 5vh, 40px); background-color: #ffb6c1; border: 4px solid #4a148c; border-radius: 4px; position: relative; z-index: 2; box-shadow: 0 4px 0px rgba(0,0,0,0.4); }
        .desk-legs { width: 80%; height: clamp(25px, 6vh, 50px); border-left: 6px solid #4a148c; border-right: 6px solid #4a148c; position: relative; top: -4px; z-index: 1; }

        /* === BEBIDAS STARBUCKS === */
        .cup-wrapper { position: absolute; bottom: 75%; left: 50%; transform: translateX(-50%); z-index: 5; cursor: pointer; transition: transform 0.2s; animation: cup-invitation 1.8s ease-in-out infinite; }
        .cup-wrapper:hover { transform: translateX(-50%) scale(1.1); }
        .cup-wrapper.has-been-clicked { animation: none; }
        @keyframes cup-invitation {
            0%, 100% { translate: 0 0; rotate: 0deg; filter: drop-shadow(0 0 0 rgba(255, 105, 180, 0)); }
            20% { translate: -3px -4px; rotate: -5deg; filter: drop-shadow(0 3px 4px rgba(255, 105, 180, 0.45)); }
            40% { translate: 3px -10px; rotate: 5deg; filter: drop-shadow(0 5px 8px rgba(255, 105, 180, 0.8)); }
            60% { translate: -2px -6px; rotate: -3deg; filter: drop-shadow(0 3px 6px rgba(255, 105, 180, 0.65)); }
            80% { translate: 2px -2px; rotate: 2deg; filter: drop-shadow(0 1px 3px rgba(255, 105, 180, 0.3)); }
        }
        .cup { width: clamp(20px, 3.5vw, 36px); height: clamp(30px, 5.5vw, 48px); background-color: #ffffff; border: 3px solid #4a148c; border-bottom-left-radius: 6px; border-bottom-right-radius: 6px; position: relative; overflow: hidden; }
        .cup-sleeve { position: absolute; top: 35%; width: 100%; height: 40%; background-color: #a1887f; border-top: 2px solid #4a148c; border-bottom: 2px solid #4a148c; }
        .cup-logo { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 60%; aspect-ratio: 1/1; background-color: #00704A; border-radius: 50%; border: 2px solid #ffffff; display: flex; justify-content: center; align-items: center; }
        .cup-logo::after { content: ''; width: 40%; height: 40%; background-color: #ffffff; border-radius: 50%; }
        .cup-lid { position: absolute; top: -10px; left: -4px; width: calc(100% + 8px); height: 12px; background-color: #ffffff; border: 3px solid #4a148c; border-top-left-radius: 10px; border-top-right-radius: 10px; }
        .cup-straw { position: absolute; top: -22px; left: 50%; transform: translateX(-50%); width: 6px; height: 16px; background-color: #00704A; border: 2px solid #4a148c; }

        /* === GLOBOS Y CONFETI === */
        .balloon { position: absolute; width: 35px; height: 45px; border: 3px solid #4a148c; border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%; z-index: 50; display: flex; justify-content: center; }
        .balloon::after { content: ''; position: absolute; bottom: -25px; width: 2px; height: 25px; background-color: #ffffff; }
        .balloon::before { content: ''; position: absolute; bottom: -4px; width: 10px; height: 6px; background-color: inherit; border: 3px solid #4a148c; border-top: none; }
        .b-purple { background-color: #ba68c8; } .b-pink { background-color: #ff69b4; } .b-white { background-color: #ffffff; }
        .ceiling-balloon { top: -10px; animation: sway 3s infinite alternate ease-in-out; }
        @keyframes sway { 0% { transform: rotate(-5deg) translateX(-2px); } 100% { transform: rotate(5deg) translateX(2px); } }
        .floating-balloon { animation: floatMid 4s infinite alternate ease-in-out; }
        @keyframes floatMid { 0% { transform: translateY(0px) rotate(-3deg); } 100% { transform: translateY(-20px) rotate(3deg); } }

        /* Confeti GSAP (Explosión) y Confeti Suelo (Estático) */
        #confetti-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 200; pointer-events: none; }
        .gsap-confetti { position: absolute; left: 50%; top: 50%; width: 12px; height: 12px; border-radius: 2px; }
        .floor-confetti { position: absolute; width: 6px; height: 6px; z-index: 1; border-radius: 1px; }

        /* === SISTEMA DIÁLOGO Y OVERLAY DENTRO DEL SCROLL === */
        #dark-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.7); z-index: 100;
            opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
        }
        #dark-overlay.active { opacity: 1; pointer-events: auto; }
        
        .active-desk { z-index: 999 !important; }

        #local-dialog {
            position: absolute; z-index: 1000;
            background-color: #ffffff; border: 5px solid #ff69b4; border-radius: 8px;
            padding: 15px; width: 280px; text-align: center; box-shadow: 0px 8px 0px rgba(0,0,0,0.4);
            transform-origin: bottom center; display: none; box-sizing: border-box;
        }
        #local-dialog::after {
            content: ''; position: absolute; bottom: -15px; left: 50%; transform: translateX(-50%);
            border-left: 10px solid transparent; border-right: 10px solid transparent; border-top: 10px solid #ff69b4;
        }

        #btn-bebeme { background-color: #ff69b4; color: #ffffff; border: 4px solid #4a148c; padding: 12px; font-size: 14px; cursor: pointer; box-shadow: 3px 3px 0px #4a148c; width: 100%; box-sizing: border-box; }
        #btn-bebeme:active { box-shadow: 0px 0px 0px #4a148c; transform: translate(3px, 3px); }
        
        #text-area-container { display: none; flex-direction: column; width: 100%; }
        #text-area-container.active { display: flex; }
        
        #cup-predefined-text {
            font-size: 12px; line-height: 1.6; color: #4a148c;
            background-color: #fce4ec; border: 4px solid #ba68c8; border-radius: 4px;
            padding: 15px 10px; box-sizing: border-box; text-align: center;
        }
        .cup-emoticon { display: inline-block; font-family: Arial, sans-serif; font-size: 1.55em; line-height: 1.15; vertical-align: middle; white-space: nowrap; }

        @media (prefers-reduced-motion: reduce) {
            .cup-wrapper { animation: none; }
        }

        /* ========================================================
           === CORRECCIONES PARA CELULAR (RESPONSIVE + SCROLL) ===
           ======================================================== */
        @media (max-width: 768px) {
            #game-window {
                max-width: none; max-height: none; height: 100dvh; width: 100vw;
                border: none; box-shadow: none; border-radius: 0;
            }
            
            /* Se asignan alturas fijas generosas para habilitar el SCROLL */
            #wall { height: 450px; flex-shrink: 0; }
            #floor { height: 550px; flex-shrink: 0; }
            
            #teacher-area { bottom: -5px; right: 2%; transform: scale(0.7); transform-origin: bottom right; }
            #chalkboard { height: 60%; width: 95%; border-width: 8px; padding: 10px; }
            #chalkboard-text { font-size: clamp(14px, 4.5vw, 24px); }
            
            /* Alineación perfecta de columnas (Grid 3x3) */
            #desk-1, #desk-4, #desk-7 { left: 18%; right: auto; transform: translateX(-50%) scale(0.75); }
            #desk-2, #desk-5, #desk-8 { left: 50%; right: auto; transform: translateX(-50%) scale(0.75); }
            #desk-3, #desk-6, #desk-9 { left: 82%; right: auto; transform: translateX(-50%) scale(0.75); }
            
            /* Alineación perfecta de filas */
            #desk-1, #desk-2, #desk-3 { bottom: 72%; }
            #desk-4, #desk-5, #desk-6 { bottom: 42%; }
            #desk-7, #desk-8, #desk-9 { bottom: 12%; }
            
            #celina { transform: translateX(-50%) scale(0.85); bottom: 10px; }
            #cat-gold { left: calc(50% - 65px); transform: scaleX(-1) scale(0.85); bottom: 12px; }
            #cat-gray { left: calc(50% + 35px); transform: scale(0.85); bottom: 12px; }
            
            #local-dialog { width: 220px; }
            #cup-predefined-text { font-size: 10px; padding: 12px 8px; }
            .balloon { transform: scale(0.8); }
        }
    </style>
</head>
<body>

    <div id="game-window">
        <!-- Confeti Inicial pegado a la pantalla (GSAP) -->
        <div id="confetti-container"></div>

        <!-- Área Habilitada para Scrolling -->
        <div id="scroll-area">
            
            <!-- Contenedor del Cuarto que agrupa todo y crece hacia abajo -->
            <div id="room-container">
                
                <!-- Overlay Oscuro y Luces de Disco abarcarán todo el cuarto -->
                <div id="disco-lights"></div>
                <div id="dark-overlay"></div>

                <!-- Pop-up Localizado (Ahora viaja con el cuarto al hacer scroll) -->
                <div id="local-dialog">
                    <button id="btn-bebeme">click me ଘ(੭ˊᵕˋ)੭*</button>
                    <div id="text-area-container">
                        <p id="cup-predefined-text"></p>
                    </div>
                </div>

                <!-- Elementos del Cuarto -->
                <div id="disco-wire"></div>
                <div id="disco-ball"></div>

                <!-- Globos Techo -->
                <div class="balloon b-purple ceiling-balloon" style="left: 10%;"></div>
                <div class="balloon b-pink ceiling-balloon" style="left: 30%; animation-delay: 0.5s;"></div>
                <div class="balloon b-white ceiling-balloon" style="right: 35%; animation-delay: 1s;"></div>
                <div class="balloon b-purple ceiling-balloon" style="right: 5%; animation-delay: 0.2s;"></div>
                <div class="balloon b-pink floating-balloon" style="bottom: 30%; left: 5%;"></div>
                <div class="balloon b-white floating-balloon" style="bottom: 40%; right: 8%; animation-delay: 1s;"></div>

                <!-- Pared y Pizarra -->
                <div id="wall">
                    <div id="chalkboard">
                        <h1 id="chalkboard-text"> FELI PUMPUM CELINA ᕙ(`▿´)ᕗ °.•☆•.° </h1>
                    </div>

                    <!-- Escritorio Profesor -->
                    <div id="teacher-area">
                        <div class="cake">
                            <div class="candles"><div class="candle"><div class="flame"></div></div><div class="candle"><div class="flame" style="animation-delay: 0.2s"></div></div><div class="candle"><div class="flame" style="animation-delay: 0.4s"></div></div></div>
                            <div class="cake-layer-top"></div><div class="cake-layer-bottom"></div>
                        </div>
                        <div class="teacher-desk-top"></div><div class="teacher-desk-base"></div>
                    </div>
                </div>

                <!-- Piso, Gatos, Celina y Pupitres -->
                <div id="floor">
                    
                    <!-- Celina y Gatos (Centro) -->
                    <div id="cat-gold"><div class="cat-eye"></div><div class="cat-eye"></div><div class="cat-paw paw-l"></div><div class="cat-paw paw-r"></div><div class="cat-tail"></div></div>
                    <div id="celina">
                        <div class="c-hair-back"></div>
                        <div class="c-head"><div class="c-bangs"></div><div class="c-eye"></div><div class="c-eye"></div><div class="c-blush left"></div><div class="c-blush right"></div></div>
                        <div class="c-torso-group">
                            <div class="c-arm c-arm-left"></div><div class="c-shirt"></div><div class="c-arm c-arm-right"></div>
                        </div>
                        <div class="c-skirt"></div><div class="c-legs"><div class="c-leg"></div><div class="c-leg"></div></div>
                    </div>
                    <div id="cat-gray"><div class="cat-eye"></div><div class="cat-eye"></div><div class="cat-paw paw-l"></div><div class="cat-paw paw-r"></div><div class="cat-tail"></div></div>

                    <!-- Pupitres Interactivos -->
                    <div class="desk-group" id="desk-1">
                        <div class="cup-wrapper" data-cup="0"><div class="cup-lid"></div><div class="cup-straw"></div><div class="cup"><div class="cup-sleeve"><div class="cup-logo"></div></div></div></div>
                        <div class="desk-top"></div><div class="desk-legs"></div>
                    </div>
                    <div class="desk-group" id="desk-2"><div class="desk-top"></div><div class="desk-legs"></div></div>
                    <div class="desk-group" id="desk-3">
                        <div class="cup-wrapper" data-cup="1"><div class="cup-lid"></div><div class="cup-straw"></div><div class="cup"><div class="cup-sleeve"><div class="cup-logo"></div></div></div></div>
                        <div class="desk-top"></div><div class="desk-legs"></div>
                    </div>

                    <div class="desk-group" id="desk-4"><div class="desk-top"></div><div class="desk-legs"></div></div>
                    <div class="desk-group" id="desk-5">
                        <div class="cup-wrapper" data-cup="2"><div class="cup-lid"></div><div class="cup-straw"></div><div class="cup"><div class="cup-sleeve"><div class="cup-logo"></div></div></div></div>
                        <div class="desk-top"></div><div class="desk-legs"></div>
                    </div>
                    <div class="desk-group" id="desk-6"><div class="desk-top"></div><div class="desk-legs"></div></div>

                    <div class="desk-group" id="desk-7">
                        <div class="cup-wrapper" data-cup="3"><div class="cup-lid"></div><div class="cup-straw"></div><div class="cup"><div class="cup-sleeve"><div class="cup-logo"></div></div></div></div>
                        <div class="desk-top"></div><div class="desk-legs"></div>
                    </div>
                    <div class="desk-group" id="desk-8"><div class="desk-top"></div><div class="desk-legs"></div></div>
                    <div class="desk-group" id="desk-9">
                        <div class="cup-wrapper" data-cup="4"><div class="cup-lid"></div><div class="cup-straw"></div><div class="cup"><div class="cup-sleeve"><div class="cup-logo"></div></div></div></div>
                        <div class="desk-top"></div><div class="desk-legs"></div>
                    </div>
                </div> <!-- Fin de Floor -->
            </div> <!-- Fin de Room Container -->
        </div> <!-- Fin de Scroll Area -->
    </div> <!-- Fin de Game Window -->

    <script>
        window.onload = () => {
            // === CONFETI DEL SUELO (Estático) ===
            const floor = document.getElementById('floor');
            const floorColors = ['#ff69b4', '#ce93d8', '#ffffff', '#ffd54f'];
            for(let i = 0; i < 40; i++) {
                let conf = document.createElement('div');
                conf.className = 'floor-confetti';
                conf.style.left = Math.random() * 100 + '%';
                conf.style.top = Math.random() * 100 + '%';
                conf.style.backgroundColor = floorColors[Math.floor(Math.random() * floorColors.length)];
                conf.style.transform = `rotate(${Math.random() * 360}deg)`;
                floor.appendChild(conf);
            }

            // === EXPLOSIÓN DE CONFETI EN LA CARA (GSAP) ===
            const container = document.getElementById('confetti-container');
            const colors = ['#ff69b4', '#ce93d8', '#ffffff', '#ffd54f', '#ba68c8'];
            
            for(let i = 0; i < 120; i++) {
                let p = document.createElement('div');
                p.className = 'gsap-confetti';
                p.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                container.appendChild(p);

                gsap.to(p, {
                    x: `random(-500, 500)`,
                    y: `random(-500, 500)`,
                    rotation: `random(-720, 720)`,
                    scale: `random(1, 3)`,
                    opacity: 0,
                    duration: `random(1, 2.5)`,
                    ease: "power3.out",
                    delay: 0.1
                });
            }

            setTimeout(() => {
                container.innerHTML = '';
                gsap.to("#chalkboard-text", {
                    scale: 1, opacity: 1, duration: 1.5, ease: "elastic.out(1, 0.5)"
                });
            }, 500);
        };

        // === LÓGICA DE BEBIDAS Y DIÁLOGO SCROLLABLE ===
        const cupData = [
            { text: "Siempre tendre razones para no dejarte de querer ♡(˶ᵔ ᵕ ᵔ˶)", isFirstClick: true },
            { text: "Siempre sales adelante a tu manera, despues de una lloradita eres imparable!. ૮₍ ˶ᵔ ᵕ ᵔ˶ ₎ა", isFirstClick: true },
            { text: "Eres un pilar en mi vida y sin ti, muchas cosas en mi no serian iguales. Gracias (⁄ ⁄•⁄ω⁄•⁄ ⁄)♡", isFirstClick: true },
            { text: "Si te describo con una palabra, se me vienen dos: Maldita y Risueña. (⁄ ⁄•⁄-⁄•⁄ ⁄)", isFirstClick: true },
            { text: "Eres unica por tu forma de alegrar y dar vida cualquier lugar donde estas. Se que cualquier plan es bueno si estas tu en el ୨୧(˶ᵔ ᵕ ᵔ˶)୨୧ ", isFirstClick: true }
        ];

        let currentCupIndex = -1;
        const cups = document.querySelectorAll('.cup-wrapper');
        const darkOverlay = document.getElementById('dark-overlay');
        const localDialog = document.getElementById('local-dialog');
        const roomContainer = document.getElementById('room-container');
        
        const btnBebeme = document.getElementById('btn-bebeme');
        const textAreaContainer = document.getElementById('text-area-container');
        const cupPredefinedText = document.getElementById('cup-predefined-text');
        const cupEmoticonPattern = /(♡\(˶ᵔ ᵕ ᵔ˶\)|૮₍ ˶ᵔ ᵕ ᵔ˶ ₎ა|\(⁄ ⁄•⁄ω⁄•⁄ ⁄\)♡|\(⁄ ⁄•⁄-⁄•⁄ ⁄\)|୨୧\(˶ᵔ ᵕ ᵔ˶\)୨୧)/g;

        function displayCupText(text) {
            const emoticons = new Set(text.match(cupEmoticonPattern) || []);
            const content = text.split(cupEmoticonPattern).map(part => {
                if (!emoticons.has(part)) return document.createTextNode(part);

                const emoticon = document.createElement('span');
                emoticon.className = 'cup-emoticon';
                emoticon.textContent = part;
                return emoticon;
            });
            cupPredefinedText.replaceChildren(...content);
        }

        function closeDialog() {
            gsap.to(localDialog, { scale: 0, opacity: 0, duration: 0.2, ease: "power1.in", onComplete: () => {
                localDialog.style.display = 'none';
                darkOverlay.classList.remove('active');
                document.querySelectorAll('.desk-group').forEach(d => d.classList.remove('active-desk'));
            }});
        }

        cups.forEach(cup => {
            cup.addEventListener('click', function(e) {
                e.stopPropagation();
                cup.classList.add('has-been-clicked');
                
                document.querySelectorAll('.desk-group').forEach(d => d.classList.remove('active-desk'));
                const desk = cup.closest('.desk-group');
                desk.classList.add('active-desk'); 

                // Cálculos de posición relativos a roomContainer (perfectos para el scroll)
                const cupRect = cup.getBoundingClientRect();
                const rcRect = roomContainer.getBoundingClientRect();
                
                let leftPos = (cupRect.left - rcRect.left) + (cupRect.width / 2);
                const dialogWidth = window.innerWidth <= 768 ? 220 : 280;
                const halfWidth = dialogWidth / 2;
                
                if (leftPos - halfWidth < 10) { leftPos = halfWidth + 10; }
                if (leftPos + halfWidth > rcRect.width - 10) { leftPos = rcRect.width - halfWidth - 10; }

                const topPos = (cupRect.top - rcRect.top) - 15; 

                localDialog.style.display = 'block';
                localDialog.style.left = `${leftPos}px`;
                localDialog.style.top = `${topPos}px`;
                localDialog.style.transform = `translate(-50%, -100%)`; 

                currentCupIndex = parseInt(this.getAttribute('data-cup'));
                const data = cupData[currentCupIndex];

                if (data.isFirstClick) {
                    btnBebeme.style.display = 'block';
                    textAreaContainer.classList.remove('active');
                } else {
                    btnBebeme.style.display = 'none';
                    textAreaContainer.classList.add('active');
                    displayCupText(data.text);
                }

                darkOverlay.classList.add('active');
                gsap.fromTo(localDialog, {scale: 0, opacity: 0}, {scale: 1, opacity: 1, duration: 0.4, ease: "back.out(1.5)"});
            });
        });

        btnBebeme.addEventListener('click', function() {
            cupData[currentCupIndex].isFirstClick = false;
            btnBebeme.style.display = 'none';
            textAreaContainer.classList.add('active');
            displayCupText(cupData[currentCupIndex].text);
        });

        darkOverlay.addEventListener('click', closeDialog);
    </script>
</body>
</html>
